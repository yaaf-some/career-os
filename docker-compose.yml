services:
  app:
    image: ghcr.io/yaaf-some/career-os-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scanner:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      CAREER_OS_BIND: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-sqlite:///var/lib/career-os/career-os.db?mode=rwc}
      AI_BRIDGE_URL: ${AI_BRIDGE_URL:-http://host.docker.internal:8787}
      AI_BRIDGE_TOKEN: ${AI_BRIDGE_TOKEN:-}
      AI_AGY_DAILY_CALL_LIMIT: ${AI_AGY_DAILY_CALL_LIMIT:-}
      SCANNER_URL: ${SCANNER_URL:-http://scanner:8081}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      HOME_LOCATION_AREA: ${HOME_LOCATION_AREA:-West Los Angeles, CA}
      DEFAULT_TRAVEL_MODE: ${DEFAULT_TRAVEL_MODE:-DRIVE}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      GOOGLE_SYNC_INTERVAL_HOURS: ${GOOGLE_SYNC_INTERVAL_HOURS:-12}
      ALLOWED_TAILSCALE_USER: ${ALLOWED_TAILSCALE_USER:-you@example.com}
      STATIC_DIR: /app/static
    volumes:
      - career_os_db:/var/lib/career-os
      - ${DATA_DIR:-./example-data}:/data:ro
    healthcheck:
      test: ["CMD", "/app/career-os-api", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    restart: unless-stopped

  scanner:
    image: ghcr.io/yaaf-some/career-os-scanner:latest
    build:
      context: .
      dockerfile: scanner.Dockerfile
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  career_os_db:
