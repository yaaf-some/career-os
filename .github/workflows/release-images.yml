name: Release Container Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build & Publish Multi-Arch Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for career-os-app
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/career-os-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push career-os-app
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Attest career-os-app build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/career-os-app
          subject-digest: ${{ steps.build_app.outputs.digest }}
          push-to-registry: true

      - name: Metadata for career-os-scanner
        id: meta_scanner
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/career-os-scanner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push career-os-scanner
        id: build_scanner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scanner.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta_scanner.outputs.tags }}
          labels: ${{ steps.meta_scanner.outputs.labels }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner

      - name: Attest career-os-scanner build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/career-os-scanner
          subject-digest: ${{ steps.build_scanner.outputs.digest }}
          push-to-registry: true
