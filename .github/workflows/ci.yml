name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Stack Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      scanner: ${{ steps.filter.outputs.scanner }}
      ai_bridge: ${{ steps.filter.outputs.ai_bridge }}
      docker_app: ${{ steps.filter.outputs.docker_app }}
      docker_scanner: ${{ steps.filter.outputs.docker_scanner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
            web:
              - 'web/**'
            scanner:
              - 'scanner/**'
            ai_bridge:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/ai-bridge/**'
              - 'deploy/launchd/**'
            docker_app:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            docker_scanner:
              - 'scanner.Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, test, OpenAPI, audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit
      - name: Format check
        run: cargo fmt --check
      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit & integration tests
        run: cargo test
      - name: Export & validate OpenAPI 3.1 schema
        run: |
          cargo run --bin career-os-api -- --export-openapi /tmp/openapi.json
          python3 -m json.tool /tmp/openapi.json > /dev/null
      - name: RustSec advisory audit
        run: cargo audit

  web:
    name: Web PWA (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scanner:
    name: Scanner (test)
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  ai-bridge-macos:
    name: ai-bridge (macOS build, test, plist lint)
    needs: changes
    if: needs.changes.outputs.ai_bridge == 'true'
    # The bridge runs on the macOS host under launchd; test it on the real OS.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build -p career-os-ai-bridge --locked
      - name: Test (real-CLI smoke tests stay ignored)
        run: cargo test -p career-os-ai-bridge --locked
      - name: Lint launchd plists
        run: plutil -lint deploy/launchd/*.plist.example

  docker-app:
    name: Container App (hadolint, build, Trivy)
    needs: [changes, rust, web]
    if: >-
      !failure() && !cancelled() && (
        needs.changes.outputs.docker_app == 'true' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.web == 'true'
      )
    # Native linux/arm64 matches the Mac mini deploy target (arm64-only; x86 hosts build locally).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build app image (CI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: career-os-app:ci
          cache-from: type=gha,scope=app-ci
          cache-to: type=gha,mode=max,scope=app-ci
      - name: Report app image footprint
        run: |
          docker image ls career-os-app:ci --format "App image size: {{.Size}}"
      - name: Smoke test app container (non-root, read-only rootfs, healthcheck)
        run: |
          docker run -d --name app-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e AI_DEMO_MODE=true career-os-app:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app-smoke 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' app-smoke)" = "true" ] || break
            docker exec app-smoke /app/career-os-api --healthcheck && status=healthy && break
            sleep 1
          done
          docker logs app-smoke
          [ "$(docker inspect -f '{{.Config.User}}' app-smoke)" = "65532:65532" ]
          [ "$status" = "healthy" ] || { echo "app container never became healthy"; exit 1; }
          time docker stop app-smoke
          [ "$(docker inspect -f '{{.State.ExitCode}}' app-smoke)" = "0" ] || { echo "app did not exit cleanly on SIGTERM"; exit 1; }
      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: career-os-app:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-scanner:
    name: Container Scanner (hadolint, build, Trivy)
    needs: [changes, scanner]
    if: >-
      !failure() && !cancelled() && (
        needs.changes.outputs.docker_scanner == 'true' ||
        needs.changes.outputs.scanner == 'true'
      )
    # Native linux/arm64 matches the Mac mini deploy target (arm64-only; x86 hosts build locally).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint scanner.Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < scanner.Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build scanner image (CI)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scanner.Dockerfile
          load: true
          tags: career-os-scanner:ci
          cache-from: type=gha,scope=scanner-ci
          cache-to: type=gha,mode=max,scope=scanner-ci
      - name: Report scanner image footprint
        run: |
          docker image ls career-os-scanner:ci --format "Scanner image size: {{.Size}}"
      - name: Smoke test scanner container (non-root, read-only rootfs, healthcheck)
        run: |
          docker run -d --name scanner-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true career-os-scanner:ci
          ok=false
          for _ in $(seq 1 20); do
            if docker exec scanner-smoke node -e "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then ok=true; break; fi
            sleep 1
          done
          docker logs scanner-smoke
          [ "$ok" = "true" ] || { echo "scanner never became healthy"; exit 1; }
          [ "$(docker inspect -f '{{.Config.User}}' scanner-smoke)" = "10001:10001" ]
          time docker stop scanner-smoke
          [ "$(docker inspect -f '{{.State.ExitCode}}' scanner-smoke)" = "0" ] || { echo "scanner did not exit cleanly on SIGTERM"; exit 1; }
      - name: Scan scanner image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: career-os-scanner:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Security (gitleaks, actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Static workflow security audit (zizmor)
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  ci-gate:
    name: CI Gate
    needs: [changes, rust, web, scanner, ai-bridge-macos, docker-app, docker-scanner, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate stack & security checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SCANNER_RESULT: ${{ needs.scanner.result }}
          AI_BRIDGE_RESULT: ${{ needs.ai-bridge-macos.result }}
          DOCKER_APP_RESULT: ${{ needs.docker-app.result }}
          DOCKER_SCANNER_RESULT: ${{ needs.docker-scanner.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "changes=$CHANGES_RESULT rust=$RUST_RESULT web=$WEB_RESULT scanner=$SCANNER_RESULT ai_bridge=$AI_BRIDGE_RESULT docker_app=$DOCKER_APP_RESULT docker_scanner=$DOCKER_SCANNER_RESULT security=$SECURITY_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "Core gate (changes/security) failed"
            exit 1
          fi
          for res in "$RUST_RESULT" "$WEB_RESULT" "$SCANNER_RESULT" "$AI_BRIDGE_RESULT" "$DOCKER_APP_RESULT" "$DOCKER_SCANNER_RESULT"; do
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "Stack job failed with status: $res"
              exit 1
            fi
          done
          echo "All required stack & security checks passed."
