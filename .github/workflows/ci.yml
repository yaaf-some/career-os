name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Stack Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      scanner: ${{ steps.filter.outputs.scanner }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
            web:
              - 'web/**'
            scanner:
              - 'scanner/**'
            docker:
              - 'Dockerfile'
              - 'scanner.Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (fmt, clippy, test, OpenAPI, audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-audit
      - name: Format check
        run: cargo fmt --check
      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit & integration tests
        run: cargo test
      - name: Export & validate OpenAPI 3.1 schema
        run: |
          cargo run --bin career-os-api -- --export-openapi /tmp/openapi.json
          python3 -m json.tool /tmp/openapi.json > /dev/null
      - name: RustSec advisory audit
        run: cargo audit

  web:
    name: Web PWA (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scanner:
    name: Scanner (test)
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Containers (hadolint, build, Trivy)
    needs: changes
    if: >-
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 < scanner.Dockerfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build scanner image (CI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scanner.Dockerfile
          load: true
          tags: career-os-scanner:ci
          cache-from: type=gha,scope=scanner-ci
          cache-to: type=gha,mode=max,scope=scanner-ci
      - name: Scan scanner image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: career-os-scanner:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build app image (CI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: career-os-app:ci
          cache-from: type=gha,scope=app-ci
          cache-to: type=gha,mode=max,scope=app-ci
      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: career-os-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Security (gitleaks, actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Install actionlint
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: actionlint
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Static workflow security audit (zizmor)
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  ci-gate:
    name: CI Gate
    needs: [changes, rust, web, scanner, docker, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate stack & security checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SCANNER_RESULT: ${{ needs.scanner.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "changes=$CHANGES_RESULT rust=$RUST_RESULT web=$WEB_RESULT scanner=$SCANNER_RESULT docker=$DOCKER_RESULT security=$SECURITY_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "Core gate (changes/security) failed"
            exit 1
          fi
          for res in "$RUST_RESULT" "$WEB_RESULT" "$SCANNER_RESULT" "$DOCKER_RESULT"; do
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "Stack job failed with status: $res"
              exit 1
            fi
          done
          echo "All required stack & security checks passed."
